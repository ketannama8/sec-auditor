[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sec-auditor"
version = "0.1.0"
description = "Defensive Network & Security Configuration Auditor"
requires-python = ">=3.10"
dependencies = ["colorama>=0.4.6"]

[project.scripts]
sec-auditor = "sec_auditor.cli:main"
